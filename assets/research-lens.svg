    <text x="98" y="68" font-size="21" font-weight="700" fill="#F8FAFC">Write a clear report</text>
    <text x="30" y="119" font-size="16" fill="#CBD5E1">Reproduce the issue, record the evidence,</text>
    <text x="30" y="143" font-size="16" fill="#CBD5E1">explain the real impact, and suggest a</text>
    <text x="30" y="167" font-size="16" fill="#CBD5E1">practical fix.</text>
