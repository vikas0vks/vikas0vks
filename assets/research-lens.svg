<svg width="1280" height="310" viewBox="0 0 1280 310" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="line" x1="95" y1="0" x2="1184" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4ADE80"/><stop offset=".5" stop-color="#2DD4BF"/><stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="310" rx="24" fill="#070B11"/>
  <rect x="1" y="1" width="1278" height="308" rx="23" stroke="#64748B" stroke-opacity=".25"/>
  <path d="M223 70H636M644 70H1057" stroke="url(#line)" stroke-opacity=".35" stroke-width="2" stroke-dasharray="7 9"/>

  <g transform="translate(38 28)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="374" height="254" rx="20" fill="#0A1512" stroke="#34D399" stroke-opacity=".24"/>
