    <text x="98" y="68" font-size="21" font-weight="700" fill="#F8FAFC">Test the weak points</text>
    <text x="30" y="119" font-size="16" fill="#CBD5E1">Check access rules, reverse actions, bulk</text>
    <text x="30" y="143" font-size="16" fill="#CBD5E1">features, race conditions, and unusual</text>
    <text x="30" y="167" font-size="16" fill="#CBD5E1">account states.</text>
    <rect x="30" y="201" width="170" height="30" rx="15" fill="#0D2525"/>
    <text x="48" y="221" font-family="Consolas, monospace" font-size="12" fill="#99F6E4">RULES AND EDGES</text>
  </g>

  <g transform="translate(868 28)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="374" height="254" rx="20" fill="#121021" stroke="#A78BFA" stroke-opacity=".26"/>
