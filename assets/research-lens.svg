    <text x="98" y="43" font-family="Consolas, monospace" font-size="13" letter-spacing="2" fill="#6EE7B7">STEP 01</text>
    <text x="98" y="68" font-size="21" font-weight="700" fill="#F8FAFC">Understand the app</text>
    <text x="30" y="119" font-size="16" fill="#CBD5E1">Map the main flow, user roles, requests,</text>
    <text x="30" y="143" font-size="16" fill="#CBD5E1">and state changes before starting the</text>
    <text x="30" y="167" font-size="16" fill="#CBD5E1">security tests.</text>
    <rect x="30" y="201" width="144" height="30" rx="15" fill="#10231D"/>
    <text x="48" y="221" font-family="Consolas, monospace" font-size="12" fill="#A7F3D0">FLOW AND STATE</text>
  </g>

  <g transform="translate(453 28)" font-family="Segoe UI, Arial, sans-serif">
    <rect width="374" height="254" rx="20" fill="#091619" stroke="#2DD4BF" stroke-opacity=".24"/>
    <circle cx="55" cy="48" r="28" fill="#14B8A6" fill-opacity=".14"/>
    <path d="M42 55L50 47L57 54L69 40" stroke="#5EEAD4" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="42" cy="55" r="2.5" fill="#5EEAD4"/><circle cx="50" cy="47" r="2.5" fill="#5EEAD4"/><circle cx="57" cy="54" r="2.5" fill="#5EEAD4"/><circle cx="69" cy="40" r="2.5" fill="#5EEAD4"/>
