<svg width="1280" height="300" viewBox="0 0 1280 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B10"/>
      <stop offset="0.5" stop-color="#0C1416"/>
      <stop offset="1" stop-color="#0A1022"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="760" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="0.7" stop-color="#D9FBE9"/>
      <stop offset="1" stop-color="#6EE7B7"/>
    </linearGradient>
    <radialGradient id="glowG" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(400 160) rotate(0) scale(430)">
      <stop stop-color="#10B981" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#10B981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowV" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(1150 80) rotate(0) scale(330)">
      <stop stop-color="#A78BFA" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M 44 0 L 0 0 0 44" fill="none" stroke="#10B981" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="300" fill="url(#bg)"/>
  <rect width="1280" height="300" fill="url(#grid)"/>
  <rect width="1280" height="300" fill="url(#glowG)"/>
  <rect width="1280" height="300" fill="url(#glowV)"/>

  <!-- terminal caret block, left -->
  <g font-family="Consolas, monospace">
    <text x="66" y="104" font-size="21" fill="#34D399">&gt; whoami</text>
    <text x="86" y="136" font-size="21" fill="#6EE7B7">security researcher</text>
    <text x="66" y="176" font-size="21" fill="#34D399">&gt; focus</text>
    <text x="86" y="208" font-size="21" fill="#6EE7B7">business logic · access control</text>
    <text x="66" y="248" font-size="21" fill="#34D399">&gt; <tspan fill="#6EE7B7">_</tspan></text>
  </g>

  <!-- identity block, right -->
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="700" y="150" font-size="17" fill="#8B9BB4">I am</text>
    <text x="700" y="196" font-size="64" font-weight="700" fill="url(#word)">Vikas Maurya</text>
  </g>
  <g font-family="Consolas, monospace">
    <text x="702" y="236" font-size="22" fill="#10B981">@vikas0vks</text>
    <rect x="862" y="215" width="190" height="34" rx="17" fill="none" stroke="#10B981" stroke-opacity="0.5"/>
    <text x="878" y="237" font-size="17" fill="#6EE7B7">bug bounty hunter</text>
  </g>
  <g font-family="Consolas, monospace" fill="#4ADE80" fill-opacity="0.35" font-size="60" font-weight="700">
    <text x="1212" y="280" text-anchor="end">{ }</text>
  </g>
</svg>
